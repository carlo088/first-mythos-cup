_config_version: 12

model:
  provider: "openai-api"
  default: "${HERMES_MODEL}"

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"

agent:
  max_turns: 250

gateway:
  busy_input_mode: "queue"

session_reset:
  mode: "idle"
  idle_minutes: 360

quick_commands:
  fresh:
    type: "alias"
    target: "/new"

display:
  tool_progress: "all"

security:
  redact_secrets: true
