_config_version: 12

model:
  provider: "openai-api"
  default: "${HERMES_MODEL}"

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"

agent:
  max_turns: 250
  api_max_retries: 2

compression:
  enabled: true
  threshold: 0.05
  target_ratio: 0.20
  protect_last_n: 20
  protect_first_n: 0
  hygiene_hard_message_limit: 100

gateway:
  busy_input_mode: "queue"

session_reset:
  mode: "idle"
  idle_minutes: 360

quick_commands:
  fresh:
    type: "alias"
    target: "/new --yes"

display:
  tool_progress: "all"

security:
  redact_secrets: true

hooks_auto_accept: true
hooks:
  pre_api_request:
    - command: "/opt/hermes/bin/first-mythos-cup-api-pacer"
      timeout: 180
