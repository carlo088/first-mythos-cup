app = "first-mythos-cup-hermes"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HERMES_MODEL = "gpt-5.6-luna"
  VESSEL_DATA_MODE = "mock"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/hermes"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
