app = "first-mythos-cup-hermes"
primary_region = "fra"

[build]
  dockerfile = "hermes/Dockerfile"

[env]
  HERMES_MODEL = "gpt-5.6-luna"
  HERMES_INFERENCE_MODEL = "gpt-5.6-luna"
  VESSEL_DATA_MODE = "mock"
  APP_URL = "https://first-mythos-cup.vercel.app"

[processes]
  app = "first-mythos-cup-gateway"

[mounts]
  source = "hermes_data"
  destination = "/opt/data"
  initial_size = "2gb"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
